services:
  - type: web
    name: volopay-bill-inbox
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL      # paste your Neon connection string (set manually)
        sync: false
      - key: APP_BASE_URL      # your live Render URL once known (set manually)
        sync: false
