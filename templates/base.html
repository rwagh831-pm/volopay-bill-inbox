<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bill Approval Inbox{% endblock %}</title>
  <style>
    :root{--bg:#0f1220;--card:#1a1f35;--line:#2a3150;--text:#e8ebf5;--muted:#9aa3c0;
          --blue:#4f7cff;--green:#2ecc8f;--amber:#f5b041;--red:#e74c6b;--chip:#232a45;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg);color:var(--text);line-height:1.5}
    .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    header .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4f7cff,#8a5cff);
                 display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
    h1{font-size:20px;margin:0}
    .sub{color:var(--muted);font-size:13px;margin:2px 0 22px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .chip{background:var(--chip);border:1px solid var(--line);color:var(--muted);
          padding:6px 12px;border-radius:999px;font-size:13px;text-decoration:none}
    .chip.active{color:#fff;border-color:var(--blue);background:rgba(79,124,255,.15)}
    .chip b{color:var(--text)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    tr:last-child td{border-bottom:none}
    .vendor{font-weight:600}
    .amt{font-variant-numeric:tabular-nums;font-weight:600}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
    .b-pending{background:rgba(245,176,65,.15);color:var(--amber)}
    .b-approved{background:rgba(79,124,255,.15);color:var(--blue)}
    .b-paid{background:rgba(46,204,143,.15);color:var(--green)}
    .b-rejected{background:rgba(231,76,107,.15);color:#e74c6b}
    .src{font-size:11px;color:var(--muted);margin-left:6px}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#222844;color:var(--text);padding:6px 11px;
         border-radius:8px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
    .btn:hover{border-color:var(--blue)}
    .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn-green{background:var(--green);border-color:var(--green);color:#06281c}
    .empty{padding:48px 16px;text-align:center;color:var(--muted)}
    form.inline{display:inline}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;background:#12172b;border:1px solid var(--line);
         color:var(--text);padding:9px 11px;border-radius:8px;font-size:14px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .back{color:var(--muted);text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">V</div>
      <div><h1>Bill Approval Inbox</h1></div>
    </header>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
